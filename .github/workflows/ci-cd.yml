name: Backend CI/CD

on:
  push:
    branches: [main, develop, "feature/**", "hotfix/**", "release/**"]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: '21'
  AWS_REGION: us-west-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-west-2.amazonaws.com

jobs:
  build-test:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, market-data-service, portfolio-service]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stockiq_test
          POSTGRES_USER: stockiq
          POSTGRES_PASSWORD: stockiq_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build & test ${{ matrix.service }}
        run: mvn clean verify -pl ${{ matrix.service }} -am -B -T 2
        env:
          DB_URL: jdbc:postgresql://localhost:5432/stockiq_test
          DB_USER: stockiq
          DB_PASSWORD: stockiq_test
          REDIS_HOST: localhost
          EUREKA_URI: http://localhost:8761/eureka
          JWT_SECRET: test-secret-key-minimum-32-characters-long

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}-${{ github.sha }}
          path: ${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

  sast-scan:
    name: SAST — OWASP Dependency Check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - name: OWASP Dependency Check
        run: mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=9 -B -pl auth-service,portfolio-service
        continue-on-error: true

  docker-push:
    name: Docker — ${{ matrix.service }}
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    strategy:
      matrix:
        service: [api-gateway, auth-service, market-data-service, portfolio-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/stockiq-${{ matrix.service }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/stockiq-${{ matrix.service }}:${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy Staging
    needs: docker-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy to ECS staging
        run: |
          for svc in api-gateway auth-service market-data-service portfolio-service notification-service; do
            aws ecs update-service --cluster stockiq-staging --service stockiq-${svc} --force-new-deployment
          done

  deploy-production:
    name: Deploy Production
    needs: docker-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy to ECS production
        run: |
          for svc in api-gateway auth-service market-data-service portfolio-service notification-service; do
            aws ecs update-service --cluster stockiq-prod --service stockiq-${svc} --force-new-deployment
          done
