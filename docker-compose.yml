services:

  # ── Infrastructure ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: stockiq-postgres
    environment:
      POSTGRES_DB: stockiq
      POSTGRES_USER: stockiq
      POSTGRES_PASSWORD: stockiq_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockiq"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stockiq-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Services ───────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: stockiq-auth
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stockiq
      SPRING_DATASOURCE_USERNAME: stockiq
      SPRING_DATASOURCE_PASSWORD: stockiq_dev
      JWT_SECRET: stockiq-local-dev-secret-key-32chars!!
      EUREKA_CLIENT_ENABLED: "false"
      SERVER_PORT: 8081
      SPRING_FLYWAY_VALIDATEONMIGRATE: "false"
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"
      SPRING_FLYWAY_TABLE: flyway_schema_history_auth
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

  market-data-service:
    build:
      context: .
      dockerfile: market-data-service/Dockerfile
    container_name: stockiq-market
    ports:
      - "8082:8082"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-demo}
      EUREKA_CLIENT_ENABLED: "false"
      SERVER_PORT: 8082
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

  portfolio-service:
    build:
      context: .
      dockerfile: portfolio-service/Dockerfile
    container_name: stockiq-portfolio
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stockiq
      SPRING_DATASOURCE_USERNAME: stockiq
      SPRING_DATASOURCE_PASSWORD: stockiq_dev
      EUREKA_CLIENT_ENABLED: "false"
      SERVER_PORT: 8083
      SPRING_FLYWAY_VALIDATEONMIGRATE: "false"
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"
      SPRING_FLYWAY_TABLE: flyway_schema_history_portfolio
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: stockiq-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: stockiq-local-dev-secret-key-32chars!!
      EUREKA_CLIENT_ENABLED: "false"
      AUTH_SERVICE_URI: http://auth-service:8081
      MARKET_DATA_SERVICE_URI: http://market-data-service:8082
      PORTFOLIO_SERVICE_URI: http://portfolio-service:8083
      MARKET_DATA_WS_URI: ws://market-data-service:8082
    depends_on:
      auth-service:
        condition: service_healthy
      market-data-service:
        condition: service_healthy
      portfolio-service:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata:
