spring:
  application:
    name: auth-service-test
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    enabled: false

jwt:
  secret: test-secret-key-minimum-32-characters-long
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000

logging:
  level:
    com.stockiq: WARN
    org.springframework.security: WARN
