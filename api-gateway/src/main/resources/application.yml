server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "https://stockiq.yourdomain.com"
            allowedMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
            allowedHeaders: ["*"]
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0

        - id: market-data-service
          uri: lb://market-data-service
          predicates:
            - Path=/api/v1/market/**
          filters:
            - StripPrefix=0
            - name: JwtAuthFilter

        - id: portfolio-service
          uri: lb://portfolio-service
          predicates:
            - Path=/api/v1/portfolio/**
          filters:
            - StripPrefix=0
            - name: JwtAuthFilter

        - id: market-data-ws
          uri: lb:ws://market-data-service
          predicates:
            - Path=/ws/**

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    preferIpAddress: true

jwt:
  secret: ${JWT_SECRET:stockiq-dev-secret-key-min-32-chars-long}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.stockiq: DEBUG
