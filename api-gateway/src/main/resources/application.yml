server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "https://stockiq.yourdomain.com"
            allowedMethods: ["GET","POST","PUT","DELETE","OPTIONS","PATCH"]
            allowedHeaders: ["*"]
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:lb://auth-service}
          predicates:
            - Path=/api/v1/auth/**

        - id: market-data-service
          uri: ${MARKET_DATA_SERVICE_URI:lb://market-data-service}
          predicates:
            - Path=/api/v1/market/**
          filters:
            - name: JwtAuthFilter

        - id: portfolio-service
          uri: ${PORTFOLIO_SERVICE_URI:lb://portfolio-service}
          predicates:
            - Path=/api/v1/portfolio/**
          filters:
            - name: JwtAuthFilter

        - id: market-data-ws
          uri: ${MARKET_DATA_WS_URI:lb:ws://market-data-service}
          predicates:
            - Path=/ws/**

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    preferIpAddress: true

jwt:
  secret: ${JWT_SECRET:stockiq-dev-secret-key-min-32-chars-long}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.stockiq: DEBUG
